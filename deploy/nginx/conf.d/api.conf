# nginx in front of the API: TLS termination and the trusted proxy hop.
#
# Certificates come from Cloudflare, not Let's Encrypt, because the DNS record
# is proxied: an ACME HTTP-01 challenge is answered by Cloudflare, never by this
# box, so certbot can't validate. A Cloudflare Origin Certificate avoids the
# problem entirely and lasts 15 years instead of 90 days.
#
# Get one from the Cloudflare dashboard: SSL/TLS → Origin Server →
# Create Certificate. Save the two blocks it shows you as:
#
#   deploy/nginx/certs/origin.pem   (the certificate)
#   deploy/nginx/certs/origin.key   (the private key — chmod 600)
#
# Then set the zone's SSL/TLS mode to **Full (strict)**. "Flexible" would leave
# Cloudflare→origin traffic unencrypted, which defeats the point.
#
# Replace api.glambylynn.com below if the hostname changes.

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name api.glambylynn.com;

    # Cloudflare talks to the origin over HTTPS under Full (strict), so plain
    # HTTP here is only ever a direct hit on the instance IP. Send it onward.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.glambylynn.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Optional: Authenticated Origin Pulls -------------------------------
    # Makes the origin refuse anything that isn't Cloudflare, so nobody can
    # bypass the proxy by hitting the instance IP directly. Enable by putting
    # Cloudflare's origin-pull CA certificate at the path below and
    # uncommenting both lines — then turn on Authenticated Origin Pulls for the
    # zone in the Cloudflare dashboard.
    #
    # This is the purpose of a certificate whose Extended Key Usage is
    # "TLS Web Client Authentication" and which carries no hostname; such a
    # certificate cannot serve as ssl_certificate above.
    #
    # ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # Product images and the odd large upload; the API caps uploads at 10 MB
    # itself, so this only needs to be above that.
    client_max_body_size 12m;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Appends this hop. Note the app prefers Cloudflare's CF-Connecting-IP
        # header when present, which is why TRUSTED_PROXY_HOPS=1 stays correct
        # even with Cloudflare adding a second hop in front of nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health probes are polled constantly and would drown the access log.
    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}
