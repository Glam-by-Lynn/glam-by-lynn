# nginx in front of the API: TLS termination and the one trusted proxy hop.
#
# Replace api.glambylynn.com with your domain before the first start — certbot
# issues the certificate against this server_name.

upstream api {
    server api:8000;
}

# Port 80 serves only the ACME challenge; everything else goes to HTTPS.
server {
    listen 80;
    server_name api.glambylynn.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.glambylynn.com;

    ssl_certificate     /etc/letsencrypt/live/api.glambylynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.glambylynn.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Product images and the odd large upload; the API caps uploads at 10 MB
    # itself, so this only needs to be above that.
    client_max_body_size 12m;

    # Long enough for a cold start or a slow report, short enough that a stuck
    # request doesn't hold a connection open indefinitely.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Appends this hop's address. TRUSTED_PROXY_HOPS=1 tells the limiter to
        # read the last entry — the one nginx just added — rather than the
        # leftmost, which the caller controls.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Connection upgrade, in case a websocket is added later.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Keep the health endpoints off the access log; they're polled constantly
    # by Docker and would otherwise drown everything else.
    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}
